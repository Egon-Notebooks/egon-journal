# Egon Notebooks — report configuration
#
# This file controls which analyses are included when running:
#   uv run egon report --full
#
# All keys default to `true` unless listed here.
# Omit a key entirely to accept the default.

# Which app your graph lives in: "obsidian" (default) or "logseq". With "logseq",
# `egon new-entry` writes Logseq's daily journal page (journals/YYYY_MM_DD.md), so point
# EGON_JOURNAL_DIR at your graph's journals/ folder.
[graph]
app = "obsidian"

[report.analyses]
wordcloud     = false   # most frequent words (formerly a word cloud); opt in
topics        = true    # BERTopic topic modeling (requires `uv sync --extra topics`)
pronoun_ratio = true

# LLM-generated Apple Health narrative (requires `uv sync --extra local-llm`
# and Ollama running). Skipped gracefully with placeholder text if Ollama is
# unavailable. Results are cached per period next to the other ML scores.
llm_health_summary    = true   # "Health Summary" text page in Section 3
llm_health_commentary = true   # per-figure commentary under each health chart

# AI summary of the period's journal entries, naming any important events, at the
# top of the full report (same Ollama requirement; skipped if it is unavailable).
llm_journal_summary   = true

# `egon report --share` writes a shorter report to give someone involved in your care.
# Uncomment a line to change what goes in it. These are the defaults:
# [report.share]
# llm_journal_summary = true
# llm_health_summary  = true
# sentiment           = true
# stress              = true
# sleep               = true
# step_count          = true
# exercise            = true
# Everything else is left out unless you set it to true here, e.g. hrv = true.

# ---------------------------------------------------------------------------
# Local LLM (requires `uv sync --extra local-llm` and `ollama serve`)
# ---------------------------------------------------------------------------
# Uncomment and set to any model available in the Ollama library.
# Smaller models (1b–3b) are fast; larger models (7b–12b) give richer questions.
# See https://ollama.com/library for available models.
#
# [local_llm]
# model = "qwen2.5:7b"     # default — strong instruction-following
# model = "llama3.2:3b"    # faster, less RAM, weaker at following instructions
# model = "llama3.2:1b"    # fastest, minimal RAM (~1 GB)
# model = "gemma3:12b"     # best quality if you have the RAM (~9 GB)
