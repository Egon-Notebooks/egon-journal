name: Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# One run per branch: a new push cancels the outdated run, except on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    permissions:
      contents: write  # publishes the coverage badge to the badges branch
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3  # setup-uv publishes no major tag since v8; pin the exact release
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run tests
        run: uv run pytest

      - name: Publish coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          uv run python scripts/coverage_badge.py coverage.xml /tmp/coverage.svg
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch --orphan badges
          cp /tmp/coverage.svg coverage.svg
          git add coverage.svg
          git commit -m "update coverage badge"
          git push --force origin badges
